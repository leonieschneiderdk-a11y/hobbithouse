<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hobbit House Room</title>
<style>
  :root{--ink:#f5e8cb;--muted:#c9b48c;--panel:rgba(20,14,8,.76);--line:rgba(240,168,70,.35);--amber:#f0a846}
  [hidden]{display:none!important}
  html,body{height:100%;margin:0;overflow:hidden;background:#0d0906;color:var(--ink);font-family:Georgia,'Iowan Old Style',serif}
  canvas{display:block;width:100%;height:100%}
  .plaque{position:fixed;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:14px;line-height:1.5}
  #help{left:16px;bottom:16px} #help b{color:var(--amber);font-weight:normal}
  #start{position:fixed;inset:0;display:grid;place-items:center;background:rgba(10,7,4,.7);cursor:pointer;font-size:22px;text-align:center;padding:16px}
  #start small{display:block;font-size:14px;color:var(--muted);margin-top:8px}
  #load{left:50%;top:16px;transform:translateX(-50%)}
  a{color:var(--amber)}
</style>
</head>
<body>
<div id="load" class="plaque">Loading the room…</div>
<div id="help" class="plaque"><b>WASD</b> walk · <b>mouse</b> look · <b>Shift</b> run · <a href="./">back to the estate</a></div>
<div id="start"><span id="rname">Click to enter</span><small>WASD to walk, mouse to look, Esc to free the cursor</small></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/RGBELoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
// Generic walkable room: ?r=<name> loads assets/rooms/<name>/room.json (model, spawn point, walkable areas, extra lights).
const ROOM=new URLSearchParams(location.search).get('r')||'entrance';let CFG={walk:[]};
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);
renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.0;renderer.physicallyCorrectLights=true;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9fb3c8);
const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,0.05,300);camera.rotation.order='YXZ';
const player={x:0,z:5,yaw:0,pitch:-0.03};
scene.add(new THREE.HemisphereLight(0xffe6c4,0x3a2414,0.32));
const sun=new THREE.DirectionalLight(0xffd2a8,3.5);sun.position.set(-1,7,-12);sun.target.position.set(0,0,4);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-10,right:10,top:10,bottom:-10,near:1,far:40});sun.shadow.bias=-0.0005;scene.add(sun,sun.target);
const loader=new THREE.GLTFLoader();
fetch('assets/rooms/'+ROOM+'/room.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(cfg=>{CFG=cfg;document.title=cfg.name;document.getElementById('rname').textContent='Click to enter: '+cfg.name;
  Object.assign(player,{x:cfg.spawn.x,z:cfg.spawn.z,yaw:cfg.spawn.yaw||0});renderer.toneMappingExposure=cfg.exposure||1;
  for(const L of cfg.lights||[]){const l=new THREE.PointLight(L.color,L.power,L.range,2);l.position.set(L.x,L.y,L.z);scene.add(l);}
loader.load(cfg.glb+'?v='+(cfg.version||1),g=>{const room=g.scene;const flames=[];
  room.traverse(o=>{if(o.isLight){o.visible=false;}if(o.isMesh){o.castShadow=true;o.receiveShadow=true;const m=o.material;
      if(m&&m.name==='flame'){m.emissive=new THREE.Color(1,0.62,0.25);m.emissiveIntensity=6;flames.push(o);}
      if(m&&m.name==='view'){o.material=new THREE.MeshBasicMaterial({map:m.emissiveMap||m.map,toneMapped:false});}
      if(m&&m.name==='glass'){m.transparent=true;m.opacity=0.15;m.depthWrite=false;}
      if(m&&/ivy|rug/.test(m.name||'')){m.transparent=false;m.alphaTest=0.5;m.side=THREE.DoubleSide;m.depthWrite=true;m.needsUpdate=true;}
      if(m&&m.envMapIntensity!==undefined)m.envMapIntensity=0.4;
      if(m&&/stonetile|octotile/.test(m.name||'')){m.color.setRGB(0.6,0.51,0.4);m.userData.floor=true;}
      if(m&&/plastered_stone_wall|rustic_stone_wall/.test(m.name||'')&&!m.userData.lit){m.color.multiplyScalar(CFG.wallBoost||1);m.userData.lit=true;}
      if(m&&/lanternglow/.test(m.name||'')){m.emissive=new THREE.Color(1,0.66,0.32);m.emissiveIntensity=5;}}});
  scene.add(room);room.updateMatrixWorld(true);
  const pts=[];for(const f of flames){const p=new THREE.Vector3();f.getWorldPosition(p);if(!pts.some(q=>q.distanceTo(p)<0.8))pts.push(p);}
  for(const p of pts.slice(0,20)){const l=new THREE.PointLight(0xffa64d,3.2,5,2);l.position.copy(p).add(new THREE.Vector3(0,0.05,0));scene.add(l);}
  roomReady=true;tryProbe();document.getElementById('load').hidden=true;},
  e=>{document.getElementById('load').textContent='Loading the room… '+(e.total?Math.round(e.loaded/e.total*100)+'%':'');},
  e=>{document.getElementById('load').textContent='The room could not load.';console.error(e);});});
// reflections: first the outdoor HDRI, then a snapshot of the lit room itself, so the glossy floor mirrors the lanterns, walls and rug
let roomReady=false,hdrReady=false,probed=false;const pmrem=new THREE.PMREMGenerator(renderer);
function setEnv(floorI,otherI){scene.traverse(o=>{if(o.isMesh&&o.material&&o.material.envMapIntensity!==undefined)o.material.envMapIntensity=o.material.userData.floor?floorI:otherI;});}
function tryProbe(){if(!roomReady||!hdrReady||probed)return;probed=true;
  const rt=new THREE.WebGLCubeRenderTarget(512,{type:THREE.HalfFloatType});const cc=new THREE.CubeCamera(0.05,200,rt);
  const p=CFG.probe||[player.x,1.3,player.z-6];cc.position.set(p[0],p[1],p[2]);scene.add(cc);
  setEnv(0.35,0.35);cc.update(renderer,scene);scene.remove(cc);
  scene.environment=pmrem.fromCubemap(rt.texture).texture;setEnv(0.35,1.1);}
new THREE.RGBELoader().load('assets/hdri/venice_sunset_2k.hdr',t=>{t.mapping=THREE.EquirectangularReflectionMapping;scene.environment=pmrem.fromEquirectangular(t).texture;t.dispose();setEnv(0.35,0.35);hdrReady=true;tryProbe();});
// bloom for the glow and glare around candles and the bright doorway
const composer=new THREE.EffectComposer(renderer);composer.addPass(new THREE.RenderPass(scene,camera));
composer.addPass(new THREE.UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),0.55,0.6,0.85));
function allowed(x,z){return CFG.walk.some(([x0,x1,z0,z1])=>x>x0&&x<x1&&z>z0&&z<z1);}
const keys={};addEventListener('keydown',e=>keys[e.code]=true);addEventListener('keyup',e=>keys[e.code]=false);
const start=document.getElementById('start');start.onclick=()=>{renderer.domElement.requestPointerLock();};
document.addEventListener('pointerlockchange',()=>{start.hidden=document.pointerLockElement===renderer.domElement;});
document.addEventListener('mousemove',e=>{if(document.pointerLockElement!==renderer.domElement)return;player.yaw-=e.movementX*0.0022;player.pitch=Math.max(-1.3,Math.min(1.3,player.pitch-e.movementY*0.0022));});
let last=performance.now(),t=0;
function frame(now){requestAnimationFrame(frame);const dt=Math.min(0.05,(now-last)/1000);last=now;t+=dt;
  let f=0,s=0;if(keys.KeyW||keys.ArrowUp)f+=1;if(keys.KeyS||keys.ArrowDown)f-=1;if(keys.KeyA||keys.ArrowLeft)s-=1;if(keys.KeyD||keys.ArrowRight)s+=1;
  const sp=(keys.ShiftLeft||keys.ShiftRight?3.4:1.7)*dt,sy=Math.sin(player.yaw),cy=Math.cos(player.yaw);
  const dx=(-sy*f+cy*s)*sp,dz=(-cy*f-sy*s)*sp;if(allowed(player.x+dx,player.z))player.x+=dx;if(allowed(player.x,player.z+dz))player.z+=dz;
  const bob=(f||s)?Math.sin(t*8)*0.015:0;camera.position.set(player.x,1.6+bob,player.z);camera.rotation.set(player.pitch,player.yaw,0);
  composer.render();}
requestAnimationFrame(frame);
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();});
window.__room={player,scene};
</script>
</body>
</html>
